
server:
  port: ${BPMN_SERVICE_PORT:8084}

spring:
  application:
    name: bpmn-service

  profiles:
    active: ${BPMN_SERVICE_PROFILES:default}

#  datasource:
#    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
#    username: ${POSTGRES_USER}
#    password: ${POSTGRES_PASSWORD}
#    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: "bpmn-service-group"
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      compression-type: gzip
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: true
        max.in.flight.requests.per.connection: 1
        linger.ms: 5

#camunda:
#  bpm:
#    admin-user:
#      id: ${CAMUNDA_ADMIN_ID}
#      password: ${CAMUNDA_ADMIN_PASSWORD}
#    default-serialization-format: application/json
#    generic-properties:
#      properties:
#        enforceHistoryTimeToLive: false
camunda:
  client:
    mode: self-managed
    grpc-address: http://localhost:26500
    rest-address: http://localhost:7080
    auth:
      method: none

app:
  topic:
    order-create-topic: "order.outbox"
    payment-events: "payment-events"
    payment-commands: "payment-commands"
    order-commands: "order-commands"

management:
  observations:
    annotations:
      enabled: true

  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c   # W3C Trace Context, traceparent: содержит Trace ID, Span ID и флаги трассировки

  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - info
          - prometheus
          - loggers

  otlp:
    metrics:
      export:
        enabled: false

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    org.hibernate.SQL: DEBUG