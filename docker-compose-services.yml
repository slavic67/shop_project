  postgres_data:
    name: order_postgres_data
  prometheus_data:
    name: order_prometheus_data
  grafana_data:
    name: order_grafana_data
  jaeger_data:
    name: order_jaeger_data
  elasticsearch_data:
    name: elasticsearch_data
  filebeat_data:
    name: filebeat_data
  rabbitmq_data:
    name: rabbitmq_data


# -------------------------------------------------------------------------------
# Изолированная сеть для сервисов
# -------------------------------------------------------------------------------
networks:
  order-service-network:
    name: order-service-network
    external: true