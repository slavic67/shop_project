version: '3.8'

# =============================================================================
# Запуск: docker-compose -f docker-compose-services.yml --env-file .dev.env up -d
# Остановка: docker-compose -f docker-compose-services.yml down
#
# Компоненты:
#   postgres     - база данных (хранит заказы)
#   prometheus   - сбор метрик (хранит 15 дней)
#   grafana      - визуализация (дашборды)
#   jaeger       - трассировка запросов
# =============================================================================

services:

  postgres:
    image: postgres:17
    container_name: order_db
    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - order-service-network
    restart: unless-stopped # Автоматический перезапуск при падении
    command:
      # Тюнинг PostgreSQL для лучшей производительности
      - "postgres"
      - "-c"
      - "max_connections=100"      # Максимум подключений (не даём упасть от перегрузки)
      - "-c"
      - "shared_buffers=256MB"      # Кэш в памяти (ускоряет запросы)
      - "-c"
      - "wal_level=logical"
    healthcheck:
      # Проверка, что БД действительно готова принимать подключения
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s   # Проверять каждые 10 секунд
      timeout: 5s     # Ждать ответа не больше 5 секунд
      retries: 5      # 5 неудач = контейнер нездоров

  # ---------------------------------------------------------------------------
  # RabbitMQ - Брокер сообщений (AMQP 0-9-1) с панелью управления
  # ---------------------------------------------------------------------------
#  rabbitmq:
#    image: rabbitmq:4.2.5-management-alpine
#    container_name: rabbitmq
#    ports:
#      - "${RABBITMQ_PORT:-5672}:5672"        # AMQP-порт для клиентов
#      - "${RABBITMQ_MGMT_PORT:-15672}:15672"  # Веб-интерфейс управления
#    environment:
#      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
#      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
#    volumes:
#      - rabbitmq_data:/var/lib/rabbitmq      # Персистентность сообщений и конфигурации
#    restart: unless-stopped
#    networks:
#      - order-service-network
#    healthcheck:
#      test: ["CMD", "rabbitmq-diagnostics", "ping"]
#      interval: 10s
#      timeout: 5s
#      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"   # PLAINTEXT для внешних подключений (хост, инструменты)
    environment:
      CLUSTER_ID: ${CLUSTER_ID}   # ваш UUID
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Два протокола: внутренний для Compose и внешний для хоста
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"


      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"

      # Параметры для single‑node
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 1000
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    networks:
      - order-service-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: order
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"   # используем внутренний INTERNAL listener
    depends_on:
      - kafka
    networks:
      - order-service-network


  # ---------------------------------------------------------------------------
  # Prometheus - сбор метрик
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    volumes:
      # Конфигурация Prometheus (скажем, куда ходить за метриками)
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Данные метрик (чтобы не терять историю при перезапуске)
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'  # Храним метрики 15 дней (production standard)
    ports:
      - '9090:9090'  # UI Prometheus (только для отладки)
    restart: unless-stopped
    networks:
      - order-service-network

  # ---------------------------------------------------------------------------
  # Grafana - визуализация дашбордов
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana  # Сохраняем дашборды и настройки
    environment:
      # Учётка для первого входа (обязательно поменять в production!)
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Дополнительные плагины (например, для круговых диаграмм)
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - '3000:3000'  # UI Grafana
    depends_on:
      - prometheus  # Логически зависит, но технически может работать без него
    restart: unless-stopped
    networks:
      - order-service-network

  # ---------------------------------------------------------------------------
  # Jaeger - распределённая трассировка
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: jaeger
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: true
      # Храним трассы в памяти (для демо), в production нужен persistent storage
      SPAN_STORAGE_TYPE: memory
    restart: unless-stopped
    networks:
      - order-service-network

  connect:
    image: debezium/connect:2.5
    container_name: debezium-connect
    ports:
      - "8099:8083"
      - "9999:9999"  # Порт для JMX-метрик
    environment:
      # Адрес Kafka-кластера (внутреннее имя сервиса в Docker-сети)
      BOOTSTRAP_SERVERS: kafka:29092
      # Идентификатор группы коннекторов (для координации в кластере Connect)
      GROUP_ID: 1
      # Название топика, где Connect хранит конфигурации коннекторов (автосоздаётся)
      CONFIG_STORAGE_TOPIC: connect_configs
      # Название топика для хранения смещений (оффсетов) коннекторов
      OFFSET_STORAGE_TOPIC: connect_offsets
      # Название топика для статусов коннекторов и их задач
      STATUS_STORAGE_TOPIC: connect_statuses
      # Конвертер для ключа сообщений, отправляемых в Kafka (здесь JSON, без схемы)
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Конвертер для значения сообщений в Kafka (тоже JSON)
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Конвертер для внутренних сообщений Connect (например, для оффсетов) – также JSON
      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Путь, где Connect ищет плагины (коннекторы). В образе Debezium по умолчанию там лежат готовые коннекторы.
      CONNECT_PLUGIN_PATH: /kafka/connect
      #      отключающие схемы в конвертерах
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: connect
    depends_on:
      - kafka
      - postgres
    networks:
      - order-service-network


