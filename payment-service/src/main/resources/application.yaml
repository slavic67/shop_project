
server:
  port: ${PAYMENT_SERVICE_PORT:8083}

spring:
  application:
    name: payment-service

  profiles:
    active: ${PAYMENT_SERVICE_PROFILES:default}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      compression-type: gzip
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      simple:
        prefetch: 10
        concurrency: 3
        max-concurrency: 10
        acknowledge-mode: manual          # подтверждение после успешной обработки
        default-requeue-rejected: false # poison -> DLQ
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10s

management:
  observations:
    annotations:
      enabled: true

  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c   # W3C Trace Context, traceparent: содержит Trace ID, Span ID и флаги трассировки

  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - info
          - prometheus
          - loggers

  otlp:
    metrics:
      export:
        enabled: false

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

app:
  topic:
    order-create-topic: "order.outbox"
    payment-events: "payment-events"